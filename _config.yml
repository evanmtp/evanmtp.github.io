# Built by GitHub Pages (Jekyll).
# Every page uses _layouts/default.html, which holds the <head> and site header.
# Front matter on each page sets its title, description, preview image, and whether it loads the lightbox.

title: Evan Montpellier
url: "https://evanmontpellier.net"
# Set explicitly: otherwise the GitHub metadata plugin may infer a baseurl.
baseurl: ""

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Sass sources are compiled locally to css/sass.css; don't publish them.
# GitHub Pages excludes CNAME by default, but only when exclude isn't set, so list it here.
exclude:
  - CNAME
  - sass
